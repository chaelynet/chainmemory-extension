<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba vector local</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: Canvas; color: CanvasText; }
  pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>Embedding con el motor empaquetado, sin CDN</h1>
<pre id="log">cargando…</pre>
<script type="module">
// Prueba el mismo codigo que va a usar la extension, pero como pagina comun: el
// motor sale de ../vendor/ (empaquetado), no de un CDN. Si algo intenta ir a
// jsdelivr, se registra y la prueba falla.
import * as T from "../vendor/transformers.min.js";
import { crearEmbedderLocal } from "../cm-embed-local.js";

const logEl = document.getElementById("log");
const L = []; const log = s => { L.push(s); logEl.textContent = L.join("\n"); };
const cos = (a, b) => { let n=0, na=0, nb=0; for (let i=0;i<a.length;i++){n+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];} return n/(Math.sqrt(na)*Math.sqrt(nb)||1); };

// Auditoria: toda descarga que haga la pagina queda anotada.
const descargas = [];
new PerformanceObserver(l => l.getEntries().forEach(e => descargas.push(e.name))).observe({ type: "resource", buffered: true });

window.__r = { estado: "corriendo" };
try {
  const ref = (await (await fetch("referencia.json")).json()).casos;
  let ultimo = "";
  const t0 = performance.now();
  const emb = await crearEmbedderLocal(T, new URL("../vendor/", location.href).href, {
    progress_callback: p => { if (p.status === "progress" && p.file && p.file.endsWith(".onnx")) {
      const s = `  bajando ${p.file}: ${Math.round(p.progress)}%`; if (s !== ultimo) { ultimo = s; } } }
  });
  log(`modelo listo en ${((performance.now()-t0)/1000).toFixed(1)} s`);
  const sims = [];
  for (const c of ref) sims.push(cos(await emb.embed(c.texto), c.vector));
  sims.sort((a,b)=>a-b);
  log(`18 textos de referencia contra el servidor: peor ${sims[0].toFixed(6)} | mediana ${sims[9].toFixed(6)}`);

  const cdn = descargas.filter(u => /jsdelivr|unpkg|cdnjs/.test(u));
  const wasm = descargas.filter(u => u.endsWith(".wasm"));
  log(`\nmotor WebAssembly cargado desde:\n  ${wasm.join("\n  ") || "(no registrado)"}`);
  log(`descargas desde un CDN de codigo: ${cdn.length ? cdn.join(", ") : "NINGUNA"}`);
  window.__r = { estado: "listo", peor: sims[0], cdn: cdn.length, wasm };
} catch (e) {
  window.__r = { estado: "error", error: String(e && e.stack || e) };
  log("ERROR: " + (e && e.stack || e));
}
</script>
</body>
</html>
