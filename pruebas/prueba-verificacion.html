<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba verificacion del modelo</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: Canvas; color: CanvasText; }
  pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>Motor propio: el modelo se verifica contra el hash anclado</h1>
<pre id="log">cargando…</pre>
<script type="module">
// Mismo codigo que la extension (cm-embed-local.js + motor/), como pagina comun:
//   1. el servidor "entrega" el .onnx con un byte cambiado: se rechaza y no queda
//      en la cache;
//   2. descarga normal: carga, y da los mismos vectores que el servidor;
//   3. alguien altera el .onnx guardado en la cache: se detecta al leerlo, se
//      descarta y se vuelve a bajar el bueno.
import { crearEmbedderLocal, CACHE_MODELO, MODELOS_BASE, RUTA_MODELO } from "../cm-embed-local.js";

const logEl = document.getElementById("log");
const L = []; const log = (s) => { L.push(s); logEl.textContent = L.join("\n"); };
const cos = (a, b) => { let n=0, na=0, nb=0; for (let i=0;i<a.length;i++){n+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];} return n/(Math.sqrt(na)*Math.sqrt(nb)||1); };
const enCache = async () => { const c = await caches.open(CACHE_MODELO); return (await c.keys()).map((r) => r.url.split("/v1/")[1]); };
const URL_ONNX = MODELOS_BASE + RUTA_MODELO + "onnx/model_fp16.onnx";

window.__r = { estado: "corriendo" };
const fallas = [];
const fetchReal = globalThis.fetch;
const pedidosOnnx = () => performance.getEntriesByType("resource").filter((e) => e.name === URL_ONNX).length;
try {
  await caches.delete(CACHE_MODELO);
  log(`cache vaciada: ${JSON.stringify(await enCache())}`);

  // ── 1. modelo alterado en el servidor ───────────────────────────────────
  globalThis.fetch = async (u, init) => {
    const r = await fetchReal(u, init);
    if (String(u?.url ?? u).endsWith("model_fp16.onnx") && r.status === 200) {
      const b = new Uint8Array(await r.arrayBuffer()); b[b.length >> 1] ^= 1;
      return new Response(b, { status: 200, headers: r.headers });
    }
    return r;
  };
  let rechazo = null;
  try { await crearEmbedderLocal(); } catch (e) { rechazo = String(e.message || e); }
  globalThis.fetch = fetchReal;
  const cache1 = await enCache();
  log(`\n1. .onnx con un byte cambiado: ${rechazo ? "RECHAZADO -> " + rechazo : "ACEPTADO (MAL)"}`);
  log(`   en la cache despues: ${JSON.stringify(cache1)}`);
  if (!rechazo || !rechazo.includes("no coincide con el hash")) fallas.push("el modelo alterado no se rechazo");
  if (cache1.some((f) => f.endsWith(".onnx"))) fallas.push("el .onnx alterado quedo en la cache");

  // ── 2. descarga normal ──────────────────────────────────────────────────
  const avances = [];
  const t0 = performance.now();
  const emb = await crearEmbedderLocal({ progress_callback: (p) => avances.push(p) });
  log(`\n2. descarga normal: modelo listo en ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  const onnx = avances.filter((p) => p.status === "progress" && p.file && p.file.endsWith(".onnx"));
  const retrocede = onnx.some((p, i) => i && p.progress < onnx[i - 1].progress);
  log(`   avisos de avance del .onnx: ${onnx.length}, ultimo ${onnx.length ? onnx.at(-1).progress : "-"}%, retrocede: ${retrocede ? "SI (MAL)" : "no"}`);
  if (!onnx.length || onnx.at(-1).progress !== 100 || retrocede) fallas.push("el avance de la descarga no es correcto");
  const cache2 = await enCache();
  log(`   en la cache despues: ${JSON.stringify(cache2)}`);
  if (cache2.length !== 2) fallas.push("en la cache no quedaron exactamente los 2 archivos");

  const ref = (await (await fetch("referencia.json")).json()).casos;
  const sims = [];
  const t1 = performance.now();
  for (const c of ref) sims.push(cos(await emb.embed(c.texto), c.vector));
  sims.sort((a, b) => a - b);
  log(`   ${sims.length} textos contra el vector del servidor: peor coseno ${sims[0].toFixed(7)} (${((performance.now() - t1) / ref.length).toFixed(0)} ms cada uno)`);
  if (sims[0] < 0.9999) fallas.push(`peor coseno ${sims[0]}`);
  const v = await emb.embed("x");
  if (!Array.isArray(v) || v.length !== 384) fallas.push("embed no devuelve un Array de 384");

  // ── 3. cache alterada ───────────────────────────────────────────────────
  const c = await caches.open(CACHE_MODELO);
  const bueno = new Uint8Array(await (await c.match(URL_ONNX)).arrayBuffer());
  const malo = bueno.slice(); malo[malo.length >> 1] ^= 1;
  await c.put(URL_ONNX, new Response(malo));
  const antes = pedidosOnnx();
  const emb3 = await crearEmbedderLocal();
  const bajoDeNuevo = pedidosOnnx() > antes;
  const ahora = new Uint8Array(await (await c.match(URL_ONNX)).arrayBuffer());
  const reparada = ahora.length === bueno.length && ahora.every((x, i) => x === bueno[i]);
  const sim3 = cos(await emb3.embed(ref[5].texto), ref[5].vector);
  log(`\n3. .onnx alterado dentro de la cache: se detecto y se bajo de nuevo: ${bajoDeNuevo ? "SI" : "NO"}; la cache quedo con el bueno: ${reparada ? "SI" : "NO"}; coseno ${sim3.toFixed(7)}`);
  if (!bajoDeNuevo || !reparada || sim3 < 0.9999) fallas.push("la cache alterada no se detecto o no se reparo");

  const origenes = [...new Set(performance.getEntriesByType("resource").map((e) => new URL(e.name).origin))];
  const terceros = origenes.filter((o) => o !== location.origin && o !== "https://models.chainmemory.ai");
  log(`\nservidores usados: ${origenes.join(", ")}`);
  log(`pedidos a terceros: ${terceros.length ? terceros.join(", ") : "NINGUNO"}`);
  if (terceros.length) fallas.push("pedidos a terceros: " + terceros.join(", "));

  log(fallas.length ? `\nFALLAS:\n  - ${fallas.join("\n  - ")}` : "\nOK: alterado en el servidor o en la cache, se rechaza; el bueno da los mismos vectores que el servidor.");
  window.__r = { estado: fallas.length ? "fallas" : "ok", fallas };
} catch (e) {
  globalThis.fetch = fetchReal;
  window.__r = { estado: "error", error: String(e && e.stack || e) };
  log("ERROR: " + (e && e.stack || e));
}
</script>
</body>
</html>
